# Datenbankregeln und Functions ausrollen, ohne Terminal.
#
# Läuft automatisch, wenn sich etwas an den Functions oder den Regeln ändert,
# und lässt sich über Actions → „Firebase ausrollen“ → „Run workflow“ auch von
# Hand starten (geht auch im Browser auf dem Handy).
#
# Einmalig unter Settings → Secrets and variables → Actions anzulegen:
#
# Reiter „Secrets“:
#   FIREBASE_SERVICE_ACCOUNT  Inhalt der Service-Account-JSON-Datei, komplett.
#   FIREBASE_PROJECT_ID       z.B. habmail-1234
#   EMAILPROXY_KEY            der ep_… Schlüssel aus dem Email-Proxy
#   GEMINI_API_KEY            für die Kategorisierung
#
# Reiter „Variables“:
#   EMAILPROXY_URL            https://dein-proxy.vercel.app
#   ADMIN_UIDS                deine Firebase-UID, mehrere mit Komma
#
# Optional, ebenfalls als Variables:
#   GEMINI_MODEL, POLL_MESSAGE_LIMIT, MAX_INLINE_ATTACHMENT_BYTES
# Optional als Secrets:
#   INGEST_TOKEN
#   POLL_TRIGGER_TOKEN
#     Ein selbst ausgedachtes langes Passwort. Schaltet pollMailboxesNow frei
#     und damit den Ersatztakt in .github/workflows/poll-mailboxes.yml, falls
#     der Cloud Scheduler nicht läuft.
#   GOCARDLESS_SECRET_ID, GOCARDLESS_SECRET_KEY
#     Nur für das automatische Abholen der Bankumsätze, und nur mit einem
#     bestehenden GoCardless-Zugang (neue gibt es seit Juli 2025 nicht mehr).
#     Der Weg über den hochgeladenen Kontoauszug braucht nichts davon.
#   RECHNUNGSPROGRAMM_TOKEN
#     Gemeinsames Passwort mit dem Rechnungsprogramm (dort HABMAIL_WEBHOOK_TOKEN).
#     Nur zusammen mit den beiden Variables unten wird Buchhaltung übergeben.
#
# Optional als Variables (Übergabe der Buchhaltung ans Rechnungsprogramm):
#   RECHNUNGSPROGRAMM_URL     https://dein-rechnungsprogramm.vercel.app
#   RECHNUNGSPROGRAMM_UID     Firebase-UID des Benutzers, dessen Buchhaltung
#                             übergeben wird — ohne sie geht nichts hinüber.
#   RECHNUNGSPROGRAMM_MAILBOXES
#                             Postfach-Kennungen mit Komma getrennt. Leer =
#                             alle Postfächer dieses Benutzers.
#
# Alle Werte landen in functions/.env.<projekt>, das der Workflow erzeugt und
# das nicht im Repository liegt. Firebase liest diese Datei beim Ausrollen und
# setzt die Werte als Umgebungsvariablen der Functions.
#
# Daraus folgt: **ein neu gesetztes Secret wirkt erst mit dem nächsten
# Ausrollen.** Wer hier etwas ändert, muss den Workflow einmal laufen lassen —
# sonst arbeiten die Functions weiter mit den Werten vom letzten Mal.
#
# ---------------------------------------------------------------------------
# Rechte des Dienstkontos
# ---------------------------------------------------------------------------
# Der Schlüssel aus „Projekteinstellungen → Dienstkonten“ reicht zum Ausrollen
# von Functions NICHT aus. In der Google Cloud Console unter IAM dem Konto
# (firebase-adminsdk-…@<projekt>.iam.gserviceaccount.com) diese Rollen geben:
#
#   Firebase Admin
#   Cloud Functions Admin
#   Dienstkontonutzer          (Service Account User)
#   Cloud Build-Bearbeiter     (Cloud Build Editor)
#   Artifact Registry-Administrator
#   Cloud Run-Administrator    (Cloud Run Admin)
#   Cloud Scheduler-Administrator
#
# Fehlt eine der ersten fünf, bricht das Ausrollen mit „Permission denied“ oder
# „missing required permission“ ab und nennt die fehlende Berechtigung.
#
# Die letzten beiden sind die tückischen: **ohne sie geht das Ausrollen durch,
# aber die geplanten Läufe finden nie statt.** Functions der 2. Generation
# laufen auf Cloud Run, und der Zeitplan ruft sie über HTTP auf. Damit das
# klappt, muss beim Ausrollen dem Dienstkonto des Zeitplans das Recht
# „Cloud Run-Aufrufer“ eingetragen werden — und genau das darf nur, wer
# Cloud Run-Administrator ist. Fehlt die Rolle, entsteht der Zeitplan (oder
# auch nicht) und jeder seiner Läufe scheitert still mit 403.
#
# Zu sehen ist das in der Cloud Console unter Cloud Scheduler: der Job
# firebase-schedule-pollMailboxes-europe-west1 fehlt entweder ganz, oder in der
# Spalte „Ergebnis des letzten Laufs“ steht dauerhaft ein Fehler.
#
# Der Schritt „Zeitplan sicherstellen“ fängt das ab: er legt den Job dann selbst
# an, auf einem Weg, der ohne die Cloud-Run-Rolle auskommt. Dafür braucht er das
# Secret POLL_TRIGGER_TOKEN.
#
# Wenn auch das nicht geht: .github/workflows/poll-mailboxes.yml taktet das
# Abholen von GitHub aus und braucht überhaupt keine Google-Rechte.

name: Firebase ausrollen

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'functions/**'
      - 'database.rules.json'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'

# Zwei gleichzeitige Deploys würden sich gegenseitig überholen.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zugangsdaten ablegen
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$SERVICE_ACCOUNT" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ -z "$PROJECT_ID" ] && missing="$missing FIREBASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Diese Secrets fehlen:$missing — siehe Kommentar oben in dieser Datei."
            exit 1
          fi

          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"

          # Früh prüfen: eine abgeschnittene oder falsch eingefügte JSON-Datei
          # führt sonst erst viel später zu einer unverständlichen Meldung.
          # Der Stacktrace von node hilft dabei niemandem, deshalb nur die
          # eigentliche Ursache in einer Zeile.
          if ! reason=$(node -e '
            const fs = require("node:fs");
            const sa = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/service-account.json", "utf8"));
            for (const field of ["type", "project_id", "private_key", "client_email"]) {
              if (!sa[field]) throw new Error("es fehlt das Feld " + field);
            }
            console.log(sa.client_email);
          ' 2>&1); then
            echo "::error::FIREBASE_SERVICE_ACCOUNT ist kein vollständiges Dienstkonto-JSON ($(printf '%s' "$reason" | grep -m1 -oE '(SyntaxError|Error): .*' | head -c 160)). Die heruntergeladene Datei komplett einfügen, von { bis }."
            exit 1
          fi
          # Das Konto in der Google Cloud Console zu finden ist mühsam, wenn man
          # mehrere Projekte hat. Hier steht die Adresse und der direkte Link.
          echo "Dienstkonto:  $reason"
          echo "Projekt:      ${reason##*@}" | sed 's/\.iam\.gserviceaccount\.com//'
          echo "Rechte hier vergeben: https://console.cloud.google.com/iam-admin/iam?project=$PROJECT_ID"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # Nötig, auch wenn firebase-tools den Ordner node_modules nicht mit
      # hochlädt: vor dem Ausrollen lädt es den Code hier, um die exportierten
      # Functions zu finden. Ohne die Abhängigkeiten scheitert das mit
      # „Couldn't find firebase-functions package in your source code“.
      - name: Abhängigkeiten der Functions installieren
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Konfiguration schreiben
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # Geheim
          EMAILPROXY_KEY: ${{ secrets.EMAILPROXY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POLL_TRIGGER_TOKEN: ${{ secrets.POLL_TRIGGER_TOKEN }}
          GOCARDLESS_SECRET_ID: ${{ secrets.GOCARDLESS_SECRET_ID }}
          GOCARDLESS_SECRET_KEY: ${{ secrets.GOCARDLESS_SECRET_KEY }}
          RECHNUNGSPROGRAMM_TOKEN: ${{ secrets.RECHNUNGSPROGRAMM_TOKEN }}
          # Nicht geheim
          EMAILPROXY_URL: ${{ vars.EMAILPROXY_URL }}
          ADMIN_UIDS: ${{ vars.ADMIN_UIDS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          POLL_MESSAGE_LIMIT: ${{ vars.POLL_MESSAGE_LIMIT }}
          MAX_INLINE_ATTACHMENT_BYTES: ${{ vars.MAX_INLINE_ATTACHMENT_BYTES }}
          RECHNUNGSPROGRAMM_URL: ${{ vars.RECHNUNGSPROGRAMM_URL }}
          RECHNUNGSPROGRAMM_UID: ${{ vars.RECHNUNGSPROGRAMM_UID }}
          RECHNUNGSPROGRAMM_MAILBOXES: ${{ vars.RECHNUNGSPROGRAMM_MAILBOXES }}
        run: |
          env_file="functions/.env.$PROJECT_ID"
          : > "$env_file"

          # Leere Werte weglassen: eine Zeile "GEMINI_MODEL=" würde den
          # Standardwert im Code überschreiben statt ihn zu lassen.
          #
          # Das abschließende "return 0" ist wichtig: der Schritt läuft unter
          # "set -e", und eine Funktion, die mit dem Ergebnis eines fehl-
          # geschlagenen Tests endet, würde den ganzen Lauf still abbrechen.
          write() {
            if [ -n "${!1}" ]; then
              printf '%s=%s\n' "$1" "${!1}" >> "$env_file"
            fi
            return 0
          }
          for name in EMAILPROXY_URL EMAILPROXY_KEY GEMINI_API_KEY GEMINI_MODEL \
                      ADMIN_UIDS INGEST_TOKEN POLL_TRIGGER_TOKEN \
                      POLL_MESSAGE_LIMIT MAX_INLINE_ATTACHMENT_BYTES \
                      GOCARDLESS_SECRET_ID GOCARDLESS_SECRET_KEY \
                      RECHNUNGSPROGRAMM_URL RECHNUNGSPROGRAMM_TOKEN \
                      RECHNUNGSPROGRAMM_UID RECHNUNGSPROGRAMM_MAILBOXES; do
            write "$name"
          done

          # Nur die Namen ins Protokoll, nie die Werte.
          echo "Gesetzt: $(cut -d= -f1 "$env_file" | tr '\n' ' ')"

          for required in EMAILPROXY_URL EMAILPROXY_KEY; do
            if ! grep -q "^$required=" "$env_file"; then
              echo "::warning::$required fehlt — HabMail kann dann keine Mails abholen."
            fi
          done

          # Übergabe ans Rechnungsprogramm: alle drei oder gar nichts.
          #
          # Der Stolperstein ist nicht das Fehlen eines Wertes, sondern der
          # Zeitpunkt: die Werte kommen erst mit diesem Schritt in die
          # Functions. Wer sie in GitHub setzt und nicht neu ausrollt, wartet
          # sonst vergeblich auf die erste übergebene Rechnung. Deshalb steht
          # der Stand jedes Mal im Protokoll.
          uebergabe=0
          for name in RECHNUNGSPROGRAMM_URL RECHNUNGSPROGRAMM_TOKEN RECHNUNGSPROGRAMM_UID; do
            if grep -q "^$name=" "$env_file"; then
              uebergabe=$((uebergabe + 1))
            fi
          done
          if [ "$uebergabe" -eq 3 ]; then
            echo "Übergabe ans Rechnungsprogramm: eingerichtet, ab jetzt aktiv."
          elif [ "$uebergabe" -gt 0 ]; then
            echo "::warning::Übergabe ans Rechnungsprogramm unvollständig — nötig sind RECHNUNGSPROGRAMM_URL, RECHNUNGSPROGRAMM_TOKEN und RECHNUNGSPROGRAMM_UID. Solange einer fehlt, wird nichts übergeben."
          else
            echo "Übergabe ans Rechnungsprogramm: nicht eingerichtet (das ist in Ordnung, wenn sie nicht gewünscht ist)."
          fi

      # Getrennt von den Functions: die Datenbankregeln sind das, was die Daten
      # der Benutzer voneinander abschottet. Die sollen auch dann live gehen,
      # wenn beim Ausrollen der Functions noch etwas fehlt.
      - name: Datenbankregeln ausrollen
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools deploy \
            --only database \
            --project "$PROJECT_ID" \
            --non-interactive \
            --force

      - name: Functions ausrollen
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools deploy \
            --only functions \
            --project "$PROJECT_ID" \
            --non-interactive \
            --force

      # Das Ausrollen kann durchgehen und der Zeitplan trotzdem fehlen — dann
      # kommen keine Mails mehr von selbst, ohne dass irgendwo ein Fehler steht.
      # Genau das ist passiert, deshalb wird hier nicht nur nachgesehen, sondern
      # der Zeitplan notfalls selbst angelegt. Siehe das Skript für den Grund,
      # warum es dabei einen anderen Weg nimmt als Firebase.
      - name: Zeitplan sicherstellen
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          POLL_TRIGGER_TOKEN: ${{ secrets.POLL_TRIGGER_TOKEN }}
          POLL_URL: ${{ vars.POLL_URL }}
        run: |
          # google-auth-library kommt mit firebase-admin mit und liegt nur unter
          # functions/node_modules. ESM sucht Pakete vom Ort der Datei aus, nicht
          # vom Arbeitsverzeichnis — deshalb muss das Skript dort liegen. Das
          # Ausrollen ist zu diesem Zeitpunkt durch, die Kopie ändert daran nichts.
          cp .github/scripts/ensure-schedule.mjs functions/ensure-schedule.mjs
          node functions/ensure-schedule.mjs

      # Läuft nur, wenn oben etwas schiefging: die häufigste Ursache sind
      # Google-APIs, die im Projekt noch nicht aktiviert sind. Das Dienstkonto
      # darf sie standardmäßig nicht selbst einschalten.
      - name: Hilfe bei Fehlern
        if: failure()
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          apis="cloudfunctions.googleapis.com,cloudbuild.googleapis.com,artifactregistry.googleapis.com,run.googleapis.com,eventarc.googleapis.com,pubsub.googleapis.com,cloudscheduler.googleapis.com,storage.googleapis.com"
          echo "::error::Ein Schritt ist fehlgeschlagen. Die Meldung dort oben nennt die Ursache; hier stehen die Links, die man dafür meistens braucht."
          echo "Bei \"Permissions denied enabling …\" fehlen die Google-APIs — der erste Link schaltet alle nötigen auf einmal ein."
          echo ""
          echo "APIs aktivieren (einmalig, als Projektinhaber):"
          echo "  https://console.cloud.google.com/flows/enableapi?apiid=$apis&project=$PROJECT_ID"
          echo ""
          echo "Rechte des Dienstkontos prüfen:"
          echo "  https://console.cloud.google.com/iam-admin/iam?project=$PROJECT_ID"
          echo ""
          echo "Nötige Rollen: Firebase Admin, Cloud Functions Admin, Dienstkontonutzer,"
          echo "Cloud Build-Bearbeiter, Artifact Registry-Administrator,"
          echo "Cloud Run-Administrator, Cloud Scheduler-Administrator."
